openapi: 3.2.0
info:
  title: Orgmetra API
  version: 0.1.0
  summary: Evidence-centered HRIS foundation API
servers:
  - url: https://api.orgmetra.example/v1
security:
  - keyverse_oidc: []
tags:
  - name: people-core
    description: People identity and employment commands.
  - name: job-architecture
    description: Evidence-backed job architecture commands.
  - name: talent-acquisition
    description: Candidate and accountable selection commands.
paths:
  /person-records:
    post:
      operationId: createPersonRecord
      summary: Create a person identity anchor and initial effective name
      tags:
        - people-core
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantReference'
        - $ref: '#/components/parameters/ActorReference'
        - $ref: '#/components/parameters/PurposeCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonRecordCommand'
      responses:
        '201':
          description: Created
        '400':
          $ref: '#/components/responses/InvalidCommand'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /job-profiles:
    post:
      operationId: createJobProfile
      summary: Create an evidence-backed draft job profile
      tags:
        - job-architecture
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantReference'
        - $ref: '#/components/parameters/ActorReference'
        - $ref: '#/components/parameters/PurposeCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobProfileCommand'
      responses:
        '201':
          description: Created
        '400':
          $ref: '#/components/responses/InvalidCommand'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
  /selection-decisions:
    post:
      operationId: recordSelectionDecision
      summary: Record a human-confirmed, evidence-backed selection decision
      tags:
        - talent-acquisition
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantReference'
        - $ref: '#/components/parameters/ActorReference'
        - $ref: '#/components/parameters/PurposeCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordSelectionDecisionCommand'
      responses:
        '201':
          description: Recorded
        '400':
          $ref: '#/components/responses/InvalidCommand'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/InsufficientEvidence'
components:
  securitySchemes:
    keyverse_oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.orgmetra.example/.well-known/openid-configuration
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Binds one actor, tenant, purpose, resource, and command digest.
      schema:
        type: string
        minLength: 16
        maxLength: 200
    TenantReference:
      name: X-Tenant-Reference
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    ActorReference:
      name: X-Actor-Reference
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    PurposeCode:
      name: X-Purpose-Code
      in: header
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{2,63}$'
  schemas:
    EvidenceReference:
      type: object
      additionalProperties: false
      required:
        - evidence_reference
        - evidence_version_code
      properties:
        evidence_reference:
          type: string
          minLength: 1
          maxLength: 500
        evidence_version_code:
          type: string
          minLength: 1
          maxLength: 200
    CreatePersonRecordCommand:
      type: object
      additionalProperties: false
      required:
        - display_name
        - effective_from
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 300
        effective_from:
          type: string
          format: date
    CreateJobProfileCommand:
      type: object
      additionalProperties: false
      required:
        - job_title
        - job_version_code
        - effective_from
        - decision_reason
        - confirmation_reference
        - evidence_references
      properties:
        job_title:
          type: string
          minLength: 1
          maxLength: 300
        job_version_code:
          type: string
          minLength: 1
          maxLength: 100
        effective_from:
          type: string
          format: date
        decision_reason:
          type: string
          minLength: 1
          maxLength: 4000
        confirmation_reference:
          type: string
          minLength: 1
          maxLength: 300
        evidence_references:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EvidenceReference'
    RecordSelectionDecisionCommand:
      type: object
      additionalProperties: false
      required:
        - candidate_profile_id
        - job_profile_id
        - decision_code
        - decision_reason
        - confirmation_reference
        - decided_at
        - evidence_references
      properties:
        candidate_profile_id:
          type: string
          format: uuid
        job_profile_id:
          type: string
          format: uuid
        decision_code:
          type: string
          pattern: '^[a-z][a-z0-9_]{2,63}$'
        decision_reason:
          type: string
          minLength: 1
          maxLength: 4000
        confirmation_reference:
          type: string
          minLength: 1
          maxLength: 300
        decided_at:
          type: string
          format: date-time
        evidence_references:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EvidenceReference'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error_code
        - message
        - trace_id
      properties:
        error_code:
          type: string
        message:
          type: string
        trace_id:
          type: string
  responses:
    InvalidCommand:
      description: Request failed generated schema or domain validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: Keyverse authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Actor, tenant, purpose, or resource authorization failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyConflict:
      description: The idempotency key is already bound to different command content.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InsufficientEvidence:
      description: The high-impact command lacks sufficient versioned evidence.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
