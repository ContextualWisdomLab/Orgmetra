name: Criterion Temporal Quality

on:
  pull_request:
    branches:
      - bootstrap
      - develop
      - main
    paths:
      - "database/migrations/0011_criterion_observation_scope.sql"
      - "tests/test_criterion_observation_scope_postgres.sh"
      - "tests/test_criterion_observation_temporal_postgres.sh"
      - ".github/workflows/criterion-temporal-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: criterion-temporal-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: Criterion recorded-time and UTC boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.14@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: orgmetra
          POSTGRES_PASSWORD: orgmetra
          POSTGRES_DB: orgmetra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orgmetra -d orgmetra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://orgmetra:orgmetra@localhost:5432/orgmetra
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact candidate checkout
        env:
          ORGMETRA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$ORGMETRA_EXPECTED_HEAD_SHA"
      - name: Build canonical criterion scope fixture
        run: bash tests/test_criterion_observation_scope_postgres.sh
      - name: Prove recorded-time and UTC boundaries
        run: bash tests/test_criterion_observation_temporal_postgres.sh
      - name: Require clean checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
