name: Hardware Acceleration ADR Quality

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-acceleration-adr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  adr_contract:
    name: Hardware acceleration ADR contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact candidate checkout
        env:
          ORGMETRA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$ORGMETRA_EXPECTED_HEAD_SHA"
      - name: Run hardware-acceleration ADR regression
        run: node --test tests/hardware-acceleration-adr-contract.test.mjs
      - name: Prove validation is read-only
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
