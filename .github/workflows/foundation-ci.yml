name: Foundation CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ORGMETRA_POSTGRES_IMAGE: postgres:16.14@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact candidate checkout
        env:
          ORGMETRA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$ORGMETRA_EXPECTED_HEAD_SHA"
      - name: Set up primary Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          check-latest: false
      - name: Set up Node.js LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          check-latest: false
      - name: Prove PostgreSQL contract inventory provenance
        env:
          ORGMETRA_POSTGRES_REGISTRY_SHA256: 66e27b4dfcd730ca4ea0cdf136e0e7e6dd6244f6abb91262671a8a95b9bc1d64
          ORGMETRA_POSTGRES_RUNNER_SHA256: bb84ea602542585d5c4d1156ea765d3dcdd7756da9d2ef7438096eed72364286
          ORGMETRA_POSTGRES_TEST_SHA256: 9c90ed386248961640aeeddabfefb9c98d96bf3c550474ffb50ec2705775c92b
          ORGMETRA_POSTGRES_QUIESCENCE_TEST_SHA256: 8d53ced7aa23df2a9896aad3cfe312852f40e5016df95f0478418a8b8bc522e5
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$ORGMETRA_POSTGRES_REGISTRY_SHA256" .github/foundation-postgres-contracts.json | sha256sum --check --strict
          printf '%s  %s\n' "$ORGMETRA_POSTGRES_RUNNER_SHA256" .github/scripts/foundation-postgres-contracts.py | sha256sum --check --strict
          printf '%s  %s\n' "$ORGMETRA_POSTGRES_TEST_SHA256" tests/test_foundation_postgres_contracts.py | sha256sum --check --strict
          printf '%s  %s\n' "$ORGMETRA_POSTGRES_QUIESCENCE_TEST_SHA256" tests/test_foundation_postgres_process_quiescence.py | sha256sum --check --strict
          python -m py_compile .github/scripts/foundation-postgres-contracts.py tests/test_foundation_postgres_contracts.py tests/test_foundation_postgres_process_quiescence.py
          python tests/test_foundation_postgres_contracts.py
          python tests/test_foundation_postgres_process_quiescence.py
          python .github/scripts/foundation-postgres-contracts.py validate
          python .github/scripts/foundation-postgres-contracts.py evidence
      - name: Compile owned Python boundaries
        run: >-
          python -m compileall -q tests packages services
      - name: Prove explicit GitHub-hosted runner image contract
        run: python -m unittest tests.test_github_actions_runner_image
      - name: Validate foundation pack
        run: npm run validate
      - name: Prove Foundation CI dependency hygiene
        run: bash tests/test_foundation_ci_dependency_hygiene.sh
      - name: Install reviewed test toolchain
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r .github/requirements/foundation-test.txt
          python -m pip check
      - name: Run owned package contracts once
        run: |
          set -euo pipefail
          for pyproject in packages/*/pyproject.toml; do
            package_dir="${pyproject%/pyproject.toml}"
            [[ -d "$package_dir/src" && -d "$package_dir/tests" ]] || continue
            package_name="$(basename "$package_dir")"
            PYTHONPATH="$package_dir/src" \
              COVERAGE_FILE="/tmp/orgmetra-${package_name}.coverage" \
              python -m pytest -c "$pyproject" "$package_dir/tests"
          done
      - name: Run owned service contracts once
        run: |
          PYTHONPATH=services/job-analysis-api/src:packages/hris-kernel/src:packages/keyverse-adapter/src COVERAGE_FILE=/tmp/orgmetra-job-analysis-api.coverage python -m pytest -c services/job-analysis-api/pyproject.toml services/job-analysis-api/tests
          PYTHONPATH=services/people-api/src:packages/hris-kernel/src:packages/keyverse-adapter/src COVERAGE_FILE=/tmp/orgmetra-people-api.coverage python -m pytest -c services/people-api/pyproject.toml services/people-api/tests
      - name: Run PostgreSQL contracts in isolated containers
        env:
          PGPASSWORD: orgmetra
        run: |
          set -euo pipefail
          snapshot_parent="$(mktemp -d)"
          snapshot_dir="$snapshot_parent/contracts"
          plan_file="$snapshot_parent/plan.json"
          current_container=""
          contract_user="orgmetra_pg_contract"
          contract_user_created=0
          runtime_parent=""

          cleanup_postgres_contracts() {
            if [[ "$contract_user_created" -eq 1 ]]; then
              sudo -n pkill -KILL -u "$contract_user" >/dev/null 2>&1 || true
            fi
            if [[ -n "$current_container" ]]; then
              docker rm --force "$current_container" >/dev/null 2>&1 || true
            fi
            if [[ -n "$runtime_parent" ]]; then
              sudo -n rm -rf -- "$runtime_parent" >/dev/null 2>&1 || true
              runtime_parent=""
            fi
            if [[ "$contract_user_created" -eq 1 ]]; then
              sudo -n userdel "$contract_user" >/dev/null 2>&1 || true
              contract_user_created=0
            fi
            chmod -R u+w "$snapshot_parent" >/dev/null 2>&1 || true
            rm -rf "$snapshot_parent"
          }
          trap cleanup_postgres_contracts EXIT

          python .github/scripts/foundation-postgres-contracts.py \
            snapshot --destination "$snapshot_dir" > "$plan_file"
          plan_tsv="$snapshot_parent/plan.tsv"
          python - "$plan_file" > "$plan_tsv" <<'PY'
          import json
          import sys
          from pathlib import Path

          snapshot = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for contract in snapshot["active"]:
              root = contract["script"]
              print(
                  "root",
                  root,
                  root,
                  contract["snapshot_script"],
                  contract["sha256"],
                  sep="\t",
              )
              for companion in contract["companions"]:
                  print(
                      "companion",
                      root,
                      companion["script"],
                      companion["snapshot_script"],
                      companion["sha256"],
                      sep="\t",
                  )
          PY
          rm -f "$plan_file"

          declare -a contracts=()
          declare -A expected_sha256=()
          declare -A snapshot_by_script=()
          declare -A companions_by_root=()
          while IFS=$'\t' read -r kind root script snapshot_script sha256; do
            if [[ "$kind" == "root" ]]; then
              contracts+=("$script")
            elif [[ "$kind" != "companion" ]]; then
              printf 'Unexpected PostgreSQL execution-snapshot record: %s\n' "$kind" >&2
              exit 1
            fi
            expected_sha256["$script"]="$sha256"
            snapshot_by_script["$script"]="$snapshot_script"
            if [[ "$kind" == "companion" ]]; then
              if [[ -n "${companions_by_root[$root]:-}" ]]; then
                companions_by_root["$root"]+=$'\n'
              fi
              companions_by_root["$root"]+="$script"
            fi
          done < "$plan_tsv"
          rm -f "$plan_tsv"

          if [[ "${#contracts[@]}" -eq 0 ]]; then
            printf 'No active PostgreSQL contracts discovered; Foundation evidence would be vacuous.\n' >&2
            exit 1
          fi

          find "$snapshot_dir" -type f -exec chmod 0444 {} +
          find "$snapshot_dir" -type d -exec chmod 0555 {} +
          chmod 0555 "$snapshot_dir" "$snapshot_parent"
          command -v sudo >/dev/null
          command -v useradd >/dev/null
          command -v userdel >/dev/null
          command -v pgrep >/dev/null
          command -v pkill >/dev/null
          if id "$contract_user" >/dev/null 2>&1; then
            printf 'Dedicated PostgreSQL contract identity already exists: %s\n' "$contract_user" >&2
            exit 1
          fi
          sudo -n useradd --system --no-create-home --shell /usr/sbin/nologin "$contract_user"
          contract_user_created=1
          sudo -n -u "$contract_user" true
          runtime_parent="$(mktemp -d)"
          chmod 0711 "$runtime_parent"

          snapshot_root_real="$(realpath -- "$snapshot_dir")"
          verify_snapshot_bytes() {
            local script="$1"
            local expected="${expected_sha256[$script]:-}"
            local snapshot_script="${snapshot_by_script[$script]:-}"
            if [[ -z "$expected" || -z "$snapshot_script" ]]; then
              printf 'PostgreSQL contract lost execution-snapshot binding: %s\n' "$script" >&2
              return 1
            fi
            if [[ -L "$snapshot_script" || ! -f "$snapshot_script" ]]; then
              printf 'PostgreSQL execution snapshot is not a regular file: %s -> %s\n' \
                "$script" "$snapshot_script" >&2
              return 1
            fi
            local snapshot_real
            snapshot_real="$(realpath -- "$snapshot_script")"
            case "$snapshot_real" in
              "$snapshot_root_real"/*) ;;
              *)
                printf 'PostgreSQL execution snapshot escaped its private root: %s -> %s\n' \
                  "$script" "$snapshot_real" >&2
                return 1
                ;;
            esac
            local observed
            observed="$(sha256sum "$snapshot_script" | awk '{print $1}')"
            if [[ "$observed" != "$expected" ]]; then
              printf 'PostgreSQL execution snapshot digest changed: %s expected=%s observed=%s\n' \
                "$script" "$expected" "$observed" >&2
              return 1
            fi
          }

          assert_contract_process_quiescence() {
            local leaked_pids
            leaked_pids="$(pgrep -u "$contract_user" || true)"
            if [[ -z "$leaked_pids" ]]; then
              return 0
            fi
            printf 'PostgreSQL contract leaked background processes as %s: %s\n' \
              "$contract_user" "$(tr '\n' ' ' <<< "$leaked_pids")" >&2
            ps -o pid=,ppid=,stat=,cmd= -p "$(paste -sd, <<< "$leaked_pids")" >&2 || true
            sudo -n pkill -KILL -u "$contract_user" >/dev/null 2>&1 || true
            return 1
          }

          run_contract_snapshot() {
            local script="$1"
            local database_url="$2"
            local snapshot_script="${snapshot_by_script[$script]}"
            local contract_runtime
            local contract_status
            local quiescence_status=0
            verify_snapshot_bytes "$script"
            contract_runtime="$(mktemp -d "$runtime_parent/run.XXXXXX")"
            sudo -n chown "$contract_user" "$contract_runtime"
            printf 'Executing PostgreSQL Foundation snapshot as dedicated non-owner: %s -> %s\n' \
              "$script" "$snapshot_script"
            set +e
            sudo -n -u "$contract_user" env \
              DATABASE_URL="$database_url" \
              PGPASSWORD="$PGPASSWORD" \
              HOME="$contract_runtime" \
              TMPDIR="$contract_runtime" \
              XDG_CACHE_HOME="$contract_runtime/.cache" \
              XDG_CONFIG_HOME="$contract_runtime/.config" \
              XDG_STATE_HOME="$contract_runtime/.local/state" \
              XDG_DATA_HOME="$contract_runtime/.local/share" \
              XDG_RUNTIME_DIR="$contract_runtime/.runtime" \
              bash "$snapshot_script"
            contract_status=$?
            set -e
            if ! assert_contract_process_quiescence; then
              quiescence_status=1
            fi
            sudo -n rm -rf -- "$contract_runtime"
            if [[ "$quiescence_status" -ne 0 ]]; then
              return 1
            fi
            return "$contract_status"
          }

          executed=()
          for contract in "${contracts[@]}"; do
            verify_snapshot_bytes "$contract"
            contract_name="$(basename "$contract" .sh)"
            container_name="orgmetra-${GITHUB_RUN_ID}-${contract_name}"
            current_container="$container_name"
            docker run --detach --name "$container_name" \
              --env POSTGRES_USER=orgmetra \
              --env POSTGRES_PASSWORD=orgmetra \
              --env POSTGRES_DB=orgmetra \
              --publish 127.0.0.1::5432 \
              "$ORGMETRA_POSTGRES_IMAGE"
            postgres_binding="$(docker port "$container_name" 5432/tcp)"
            postgres_port="${postgres_binding##*:}"
            database_url="postgresql://orgmetra:orgmetra@127.0.0.1:$postgres_port/orgmetra"
            for attempt in {1..30}; do
              if psql "$database_url" -Atqc 'SELECT 1' >/dev/null 2>&1; then
                break
              fi
              if [[ "$attempt" -eq 30 ]]; then
                docker logs "$container_name"
                exit 1
              fi
              sleep 1
            done

            run_contract_snapshot "$contract" "$database_url"

            companions_text="${companions_by_root[$contract]:-}"
            if [[ -n "$companions_text" ]]; then
              while IFS= read -r companion; do
                run_contract_snapshot "$companion" "$database_url"
              done <<< "$companions_text"
            fi

            executed+=("$contract")
            docker rm --force "$container_name" >/dev/null
            current_container=""
          done

          if [[ "${executed[*]}" != "${contracts[*]}" ]]; then
            printf 'Executed PostgreSQL contract set diverged from validated inventory.\n' >&2
            exit 1
          fi
          for bound_script in "${!expected_sha256[@]}"; do
            verify_snapshot_bytes "$bound_script"
          done
          printf 'Executed PostgreSQL Foundation roots from non-owner snapshot boundary (%d):\n' "${#executed[@]}"
          printf '%s\n' "${executed[@]}"
          cleanup_postgres_contracts
          trap - EXIT
      - name: Prove compatibility toolchain provenance
        run: |
          expected_sha256=cebb36181e8ac995a36d73a02a45094a204ff5adb3cbcdc0c9eccff309ac6aab
          actual_sha256="$(sha256sum .github/requirements/foundation-compatibility-test.txt | awk '{print $1}')"
          test "$actual_sha256" = "$expected_sha256"
      - name: Set up Python 3.12 compatibility runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Install reviewed Python 3.12 compatibility toolchain
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r .github/requirements/foundation-compatibility-test.txt
          python -m pip check
      - name: Execute every package that declares Python 3.12 supported
        env:
          ORGMETRA_PYTHON_MINOR: "3.12"
        run: |
          set -euo pipefail
          executed=0
          for pyproject in packages/*/pyproject.toml; do
            package_dir="${pyproject%/pyproject.toml}"
            [[ -d "$package_dir/src" && -d "$package_dir/tests" ]] || continue
            compatibility_decision="$(
              python - "$pyproject" <<'PY'
          import sys
          import tomllib
          from pathlib import Path
          from packaging.specifiers import InvalidSpecifier, SpecifierSet
          from packaging.version import Version

          pyproject = Path(sys.argv[1])
          project = tomllib.loads(pyproject.read_text(encoding="utf-8")).get("project", {})
          requires_python = project.get("requires-python")
          if not isinstance(requires_python, str) or not requires_python.strip():
              raise SystemExit(f"{pyproject}: project.requires-python is required")
          runtime = Version(f"{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}")
          try:
              supported = runtime in SpecifierSet(requires_python)
          except InvalidSpecifier as exc:
              raise SystemExit(
                  f"{pyproject}: invalid project.requires-python: {requires_python!r}"
              ) from exc
          print("supported" if supported else "unsupported")
          PY
            )"
            if [[ "$compatibility_decision" == "unsupported" ]]; then
              continue
            fi
            if [[ "$compatibility_decision" != "supported" ]]; then
              printf 'Unexpected compatibility decision for %s: %s\n' "$pyproject" "$compatibility_decision" >&2
              exit 1
            fi
            package_name="$(basename "$package_dir")"
            python -m compileall -q "$package_dir/src" "$package_dir/tests"
            PYTHONPATH="$package_dir/src" \
              COVERAGE_FILE="/tmp/orgmetra-${package_name}-${ORGMETRA_PYTHON_MINOR}.coverage" \
              python -m pytest -c "$pyproject" "$package_dir/tests"
            executed=$((executed + 1))
          done
          if [[ "$executed" -eq 0 ]]; then
            printf 'No owned package declared Python %s support; compatibility evidence would be vacuous.\n' "$ORGMETRA_PYTHON_MINOR" >&2
            exit 1
          fi
      - name: Set up Python 3.13 compatibility runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          check-latest: false
      - name: Install reviewed Python 3.13 compatibility toolchain
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r .github/requirements/foundation-compatibility-test.txt
          python -m pip check
      - name: Execute every package that declares Python 3.13 supported
        env:
          ORGMETRA_PYTHON_MINOR: "3.13"
        run: |
          set -euo pipefail
          executed=0
          for pyproject in packages/*/pyproject.toml; do
            package_dir="${pyproject%/pyproject.toml}"
            [[ -d "$package_dir/src" && -d "$package_dir/tests" ]] || continue
            compatibility_decision="$(
              python - "$pyproject" <<'PY'
          import sys
          import tomllib
          from pathlib import Path
          from packaging.specifiers import InvalidSpecifier, SpecifierSet
          from packaging.version import Version

          pyproject = Path(sys.argv[1])
          project = tomllib.loads(pyproject.read_text(encoding="utf-8")).get("project", {})
          requires_python = project.get("requires-python")
          if not isinstance(requires_python, str) or not requires_python.strip():
              raise SystemExit(f"{pyproject}: project.requires-python is required")
          runtime = Version(f"{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}")
          try:
              supported = runtime in SpecifierSet(requires_python)
          except InvalidSpecifier as exc:
              raise SystemExit(
                  f"{pyproject}: invalid project.requires-python: {requires_python!r}"
              ) from exc
          print("supported" if supported else "unsupported")
          PY
            )"
            if [[ "$compatibility_decision" == "unsupported" ]]; then
              continue
            fi
            if [[ "$compatibility_decision" != "supported" ]]; then
              printf 'Unexpected compatibility decision for %s: %s\n' "$pyproject" "$compatibility_decision" >&2
              exit 1
            fi
            package_name="$(basename "$package_dir")"
            python -m compileall -q "$package_dir/src" "$package_dir/tests"
            PYTHONPATH="$package_dir/src" \
              COVERAGE_FILE="/tmp/orgmetra-${package_name}-${ORGMETRA_PYTHON_MINOR}.coverage" \
              python -m pytest -c "$pyproject" "$package_dir/tests"
            executed=$((executed + 1))
          done
          if [[ "$executed" -eq 0 ]]; then
            printf 'No owned package declared Python %s support; compatibility evidence would be vacuous.\n' "$ORGMETRA_PYTHON_MINOR" >&2
            exit 1
          fi
      - name: Print exact manifest repair data
        if: failure()
        run: python tests/validate_repository.py --print-manifest
      - name: Prove validation is read-only
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
