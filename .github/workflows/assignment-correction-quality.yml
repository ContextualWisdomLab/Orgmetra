name: Assignment Correction Quality

on:
  pull_request:
    branches:
      - feat/explicit-assignment-category
      - bootstrap
      - develop
      - main
    paths:
      - "database/migrations/0018_assignment_category_supersession.sql"
      - "database/migrations/0019_assignment_correction_idempotency_route.sql"
      - "docs/traceability/assignment-category-correction-provenance.md"
      - "packages/hris-kernel/**"
      - "services/people-api/**"
      - "tests/test_assignment_category_correction_postgres.sh"
      - "tests/test_assignment_correction_idempotency_postgres.sh"
      - ".github/workflows/assignment-correction-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assignment-correction-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: Assignment correction application and 100% People coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: packages/hris-kernel/src:packages/keyverse-adapter/src:services/people-api/src
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact candidate checkout
        env:
          ORGMETRA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$ORGMETRA_EXPECTED_HEAD_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          check-latest: false
      - name: Install locked test dependencies
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r .github/requirements/foundation-test.txt
          python -m pip check
      - name: Prove HRIS correction domain contract
        run: >-
          python -m pytest
          packages/hris-kernel/tests/test_assignment_category_correction.py
          packages/hris-kernel/tests/test_assignment_category_correction_recorded_time_integrity.py
      - name: Prove the full People API at exact statement and branch coverage
        env:
          COVERAGE_FILE: /tmp/orgmetra-assignment-correction.coverage
        run: python -m pytest -c services/people-api/pyproject.toml services/people-api/tests
      - name: Require clean checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  postgres:
    name: Assignment correction PostgreSQL contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.14@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: orgmetra
          POSTGRES_PASSWORD: orgmetra
          POSTGRES_DB: orgmetra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orgmetra -d orgmetra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://orgmetra:orgmetra@localhost:5432/orgmetra
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact candidate checkout
        env:
          ORGMETRA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$ORGMETRA_EXPECTED_HEAD_SHA"
      - name: Prove normalized supersession persistence
        run: bash tests/test_assignment_category_correction_postgres.sh
      - name: Require clean checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  idempotency:
    name: Assignment correction idempotency contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.14@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: orgmetra
          POSTGRES_PASSWORD: orgmetra
          POSTGRES_DB: orgmetra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orgmetra -d orgmetra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://orgmetra:orgmetra@localhost:5432/orgmetra
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact candidate checkout
        env:
          ORGMETRA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$ORGMETRA_EXPECTED_HEAD_SHA"
      - name: Prove correction replay route is durable and closed
        run: bash tests/test_assignment_correction_idempotency_postgres.sh
      - name: Require clean checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
