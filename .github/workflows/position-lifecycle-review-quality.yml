name: Position Lifecycle Review Quality

on:
  pull_request:
    branches:
      - develop
    paths:
      - "packages/position-lifecycle-review/**"
      - ".github/requirements/foundation-test.txt"
      - ".github/workflows/position-lifecycle-review-quality.yml"
      - "docs/adr/0111-governed-position-lifecycle-review.md"
      - "docs/doctoring/position-lifecycle-review-references.md"
      - "docs/traceability/position-lifecycle-review.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: position-lifecycle-review-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Position lifecycle review contract and 100% coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact candidate checkout
        env:
          ORGMETRA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$ORGMETRA_EXPECTED_HEAD_SHA"
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          check-latest: false
      - name: Install reviewed test and build toolchain
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r .github/requirements/foundation-test.txt
          printf '%s\n' 'setuptools==84.0.0 --hash=sha256:51a52592b3b99e102b609654876bd65f19f999935166d1352678931132b0c670' > /tmp/orgmetra-position-lifecycle-review-build.txt
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r /tmp/orgmetra-position-lifecycle-review-build.txt
          python -m pip check
      - name: Compile package
        run: python -m compileall -q packages/position-lifecycle-review/src packages/position-lifecycle-review/tests
      - name: Build and install exact package artifact
        run: |
          rm -rf /tmp/orgmetra-position-lifecycle-review-build /tmp/orgmetra-position-lifecycle-review-dist /tmp/orgmetra-position-lifecycle-review-venv
          cp -a packages/position-lifecycle-review /tmp/orgmetra-position-lifecycle-review-build
          mkdir -p /tmp/orgmetra-position-lifecycle-review-dist
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir /tmp/orgmetra-position-lifecycle-review-dist /tmp/orgmetra-position-lifecycle-review-build
          test "$(find /tmp/orgmetra-position-lifecycle-review-dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          python -m venv /tmp/orgmetra-position-lifecycle-review-venv
          /tmp/orgmetra-position-lifecycle-review-venv/bin/python -m pip install --require-hashes --no-deps --only-binary=:all: -r "$GITHUB_WORKSPACE/.github/requirements/foundation-test.txt"
          wheel_path="$(find /tmp/orgmetra-position-lifecycle-review-dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          wheel_sha="$(sha256sum "$wheel_path" | awk '{print $1}')"
          printf 'orgmetra-position-lifecycle-review[test] @ file://%s --hash=sha256:%s\n' "$wheel_path" "$wheel_sha" > /tmp/orgmetra-position-lifecycle-review-install.txt
          /tmp/orgmetra-position-lifecycle-review-venv/bin/python -m pip install --require-hashes --no-deps -r /tmp/orgmetra-position-lifecycle-review-install.txt
          /tmp/orgmetra-position-lifecycle-review-venv/bin/python -m pip check
      - name: Test installed artifact with exact statement and branch coverage
        env:
          COVERAGE_FILE: /tmp/orgmetra-position-lifecycle-review.coverage
        run: |
          cd /tmp
          /tmp/orgmetra-position-lifecycle-review-venv/bin/python -m pytest -c "$GITHUB_WORKSPACE/packages/position-lifecycle-review/pyproject.toml" "$GITHUB_WORKSPACE/packages/position-lifecycle-review/tests"
      - name: Require clean checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
