name: Assignment Manifest Finalizer

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/assignment-manifest-repair-data.yml
      - tests/openapi-contract.test.mjs

permissions:
  contents: write

concurrency:
  group: assignment-manifest-finalizer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    name: Finalize exact assignment manifest
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout exact writer branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Prove exact candidate checkout
        env:
          ORGMETRA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$ORGMETRA_EXPECTED_HEAD_SHA"
      - name: Record buyer-visible assignment category change
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          bullet = (
              "- Active-PR explicit assignment-category contract: new assignment writes must record "
              "`primary` or `concurrent_secondary`; historical pre-contract rows remain "
              "`legacy_unspecified` without allocation-, row-order-, or topology-based guessing. "
              "The People API, idempotency digest, PostgreSQL persistence, OpenAPI contract, and "
              "bitemporal tenant/Employment invariant carry the same governed meaning."
          )
          if bullet not in text:
              marker = "### Added\n\n"
              if marker not in text:
                  raise SystemExit("CHANGELOG Added section is missing")
              text = text.replace(marker, marker + bullet + "\n", 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Reseal deterministic foundation manifest
        run: |
          python tests/validate_repository.py --print-manifest > manifest.json.next
          mv manifest.json.next manifest.json
          python tests/validate_repository.py
      - name: Run focused foundation contracts
        run: node --test tests/foundation-contract.test.mjs tests/openapi-contract.test.mjs
      - name: Remove completed one-shot finalizer
        run: rm .github/workflows/assignment-manifest-repair-data.yml
      - name: Refuse overwrite if another writer advanced
        env:
          ORGMETRA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ORGMETRA_WRITER_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch --no-tags origin "$ORGMETRA_WRITER_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$ORGMETRA_EXPECTED_HEAD_SHA"
      - name: Commit and push non-force finalization
        env:
          ORGMETRA_WRITER_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md manifest.json .github/workflows/assignment-manifest-repair-data.yml
          git diff --cached --check
          git commit -m "chore(assignment): seal final evidence"
          git push origin "HEAD:$ORGMETRA_WRITER_BRANCH"
