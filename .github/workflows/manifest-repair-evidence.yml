name: Manifest Repair Evidence

on:
  push:
    branches:
      - codex/product-gap-baseline-workspace
    paths:
      - ".github/workflows/manifest-repair-evidence.yml"
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/manifest-repair-evidence.yml"

permissions:
  contents: read

jobs:
  manifest:
    name: Print exact foundation manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact candidate checkout
        env:
          ORGMETRA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$ORGMETRA_EXPECTED_HEAD_SHA"
      - name: Print deterministic manifest repair data
        run: python tests/validate_repository.py --print-manifest
