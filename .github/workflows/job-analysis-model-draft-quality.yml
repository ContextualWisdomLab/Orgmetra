name: Job Analysis Model Draft Quality

on:
  pull_request:
    branches:
      - develop
    paths:
      - "packages/job-analysis-model-draft/**"
      - ".github/requirements/foundation-test.txt"
      - ".github/workflows/job-analysis-model-draft-quality.yml"
      - "docs/adr/0117-governed-job-analysis-model-draft.md"
      - "docs/doctoring/job-analysis-model-draft-references.md"
      - "docs/traceability/job-analysis-model-draft.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-analysis-model-draft-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Model-draft governance and exact 100% coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact candidate checkout
        env:
          ORGMETRA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$ORGMETRA_EXPECTED_HEAD_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          check-latest: false
      - name: Install reviewed test toolchain
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r .github/requirements/foundation-test.txt
          python -m pip check
      - name: Compile owned Python
        run: python -m compileall -q packages/job-analysis-model-draft/src packages/job-analysis-model-draft/tests
      - name: Require beginner-readable docstrings
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in sorted(Path("packages/job-analysis-model-draft").rglob("*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, (ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)) and ast.get_docstring(node) is None:
                      raise SystemExit(f"missing docstring: {path}:{node.lineno} {node.name}")
          PY
      - name: Test exact statement and branch coverage
        env:
          PYTHONPATH: packages/job-analysis-model-draft/src
          COVERAGE_FILE: /tmp/orgmetra-job-analysis-model-draft.coverage
        run: python -m pytest -c packages/job-analysis-model-draft/pyproject.toml packages/job-analysis-model-draft/tests
      - name: Require clean checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
