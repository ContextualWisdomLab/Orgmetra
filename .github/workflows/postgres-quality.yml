name: PostgreSQL Quality

on:
  pull_request:
    paths:
      - "packages/orgmetra-postgres/**"
      - "database/migrations/**"
      - "requirements/postgres-ci.txt"
      - ".github/workflows/postgres-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-quality-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  postgres-quality:
    name: PostgreSQL ${{ matrix.postgres_image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres_image:
          - postgres:17
          - postgres:18
    services:
      postgres:
        image: ${{ matrix.postgres_image }}
        env:
          POSTGRES_DB: orgmetra_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orgmetra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: packages/orgmetra-postgres/src
      ORGMETRA_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres_test_password@127.0.0.1:5432/orgmetra_test
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/postgres-ci.txt
      - name: Install exact pinned dependencies
        run: >-
          python -m pip install
          --only-binary=:all:
          --no-deps
          -r requirements/postgres-ci.txt
      - name: Record exact PostgreSQL server version
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["ORGMETRA_TEST_ADMIN_DATABASE_URL"]) as connection:
              print(connection.execute("SHOW server_version").fetchone()[0])
          PY
      - name: Compile shipped package
        run: python -m compileall -q packages/orgmetra-postgres/src
      - name: Run real PostgreSQL tests with exact coverage
        run: >-
          python -m coverage run
          --branch
          --source=orgmetra_postgres
          -m pytest
          packages/orgmetra-postgres/tests
      - name: Enforce production statement and branch coverage
        run: |
          python -m coverage report --show-missing --fail-under=100
          python -m coverage json -o postgres-coverage.json
          python - <<'PY'
          import json

          with open("postgres-coverage.json", encoding="utf-8") as report_file:
              totals = json.load(report_file)["totals"]
          if totals["percent_covered"] != 100.0:
              raise SystemExit("production statement coverage is not 100%")
          if totals["num_branches"] and totals["covered_branches"] != totals["num_branches"]:
              raise SystemExit("production branch coverage is not 100%")
          PY
      - name: Enforce public docstring coverage
        run: python packages/orgmetra-postgres/tests/validate_docstrings.py
      - name: Verify import and dependency consistency
        run: |
          python -c "import orgmetra_postgres; print(orgmetra_postgres.__all__)"
          python -m pip check
