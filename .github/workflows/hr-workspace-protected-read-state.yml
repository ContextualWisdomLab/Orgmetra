name: HR Workspace Protected Read State Quality

on:
  pull_request:
    branches:
      - develop
      - codex/product-gap-baseline-workspace
    paths:
      - "apps/hr-workspace/protected-read-state.js"
      - "apps/hr-workspace/protected-read-state.css"
      - "apps/hr-workspace/protected-read-state.stories.js"
      - "tests/hr-workspace-protected-read-state.test.mjs"
      - "docs/traceability/hr-workspace-protected-read-state.md"
      - "docs/doctoring/hr-workspace-accessibility-references.md"
      - ".github/workflows/hr-workspace-protected-read-state.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hr-workspace-protected-read-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protected-read-state:
    name: Protected read state contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact candidate checkout
        env:
          ORGMETRA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$ORGMETRA_EXPECTED_HEAD_SHA"
      - name: Set up Node.js LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          check-latest: false
      - name: Run protected-read accessibility contract
        run: node --test tests/hr-workspace-protected-read-state.test.mjs
      - name: Require clean checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
