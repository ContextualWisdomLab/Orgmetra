name: Selection Review Quality

on:
  pull_request:
    branches:
      - develop
    paths:
      - "packages/selection-review/**"
      - ".github/requirements/foundation-test.txt"
      - ".github/workflows/selection-review-quality.yml"
      - "docs/adr/0001-orgmetra-authoritative-hris-record.md"
      - "docs/doctoring/selection-review-references.md"
      - "docs/traceability/selection-review.md"
      - "docs/TRACEABILITY.md"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selection-review-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Selection review contract and 100% coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact candidate checkout
        env:
          ORGMETRA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$ORGMETRA_EXPECTED_HEAD_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          check-latest: false
      - name: Install reviewed test toolchain
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r .github/requirements/foundation-test.txt
          python -m pip check
      - name: Compile selection review package
        run: python -m compileall -q packages/selection-review/src packages/selection-review/tests
      - name: Test selection review contract with exact statement and branch coverage
        env:
          PYTHONPATH: packages/selection-review/src
          COVERAGE_FILE: /tmp/orgmetra-selection-review.coverage
        run: python -m pytest -c packages/selection-review/pyproject.toml packages/selection-review/tests
      - name: Require clean checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
