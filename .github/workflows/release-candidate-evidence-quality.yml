name: Release Candidate Evidence Quality

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-evidence-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate-evidence:
    name: Reproducible source, SBOM and provenance evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          check-latest: false
      - name: Set up Node.js LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          check-latest: false
      - name: Exercise reproducible release-candidate evidence contract
        run: >-
          node --test
          tests/release-candidate-evidence.test.mjs
          tests/release-candidate-evidence-component-merge.test.mjs
      - name: Build inspectable candidate evidence
        run: python scripts/build-release-candidate-evidence.py --output-dir "${{ runner.temp }}/orgmetra-release-candidate" --source-sha "${EXPECTED_SHA}"
      - name: Upload candidate evidence for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orgmetra-release-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/orgmetra-release-candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Validate repository contracts
        run: npm run validate
      - name: Prove clean checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
