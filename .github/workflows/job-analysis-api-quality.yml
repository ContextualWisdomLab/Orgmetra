name: Job-Analysis API Quality

on:
  pull_request:
    branches:
      - develop
    paths:
      - "services/job-analysis-api/**"
      - "packages/hris-kernel/**"
      - "packages/keyverse-adapter/**"
      - "database/migrations/0013_job_analysis_snapshot.sql"
      - "tests/test_job_analysis_snapshot_postgres.sh"
      - "tests/test_job_analysis_snapshot_schema_hardening.sh"
      - "tests/validate_repository.py"
      - "scripts/foundation-contract-core.mjs"
      - "schemas/openapi.yaml"
      - "manifest.json"
      - "docs/adr/0007-governed-job-analysis-evidence.md"
      - "docs/adr/0014-job-analysis-snapshot-persistence.md"
      - ".github/requirements/foundation-test.txt"
      - ".github/workflows/foundation-ci.yml"
      - ".github/workflows/job-analysis-api-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-analysis-api-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Job-analysis API contract and 100% coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact candidate checkout
        env:
          ORGMETRA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$ORGMETRA_EXPECTED_HEAD_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          check-latest: false
      - name: Install reviewed test toolchain
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r .github/requirements/foundation-test.txt
          python -m pip check
      - name: Compile job-analysis API boundary
        run: python -m compileall -q services/job-analysis-api/src packages/hris-kernel/src packages/keyverse-adapter/src services/job-analysis-api/tests
      - name: Test governed job-analysis contracts with exact statement and branch coverage
        env:
          PYTHONPATH: services/job-analysis-api/src:packages/hris-kernel/src:packages/keyverse-adapter/src
          COVERAGE_FILE: /tmp/orgmetra-job-analysis-api.coverage
        run: python -m pytest -c services/job-analysis-api/pyproject.toml services/job-analysis-api/tests
      - name: Require clean checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  postgres:
    name: Job-analysis PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16.14@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: orgmetra
          POSTGRES_PASSWORD: orgmetra
          POSTGRES_DB: orgmetra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orgmetra -d orgmetra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://orgmetra:orgmetra@localhost:5432/orgmetra
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact candidate checkout
        env:
          ORGMETRA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$ORGMETRA_EXPECTED_HEAD_SHA"
      - name: Run persisted job-analysis PostgreSQL contract
        run: |
          bash tests/test_job_analysis_snapshot_postgres.sh
          bash tests/test_job_analysis_snapshot_schema_hardening.sh
      - name: Require clean checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
