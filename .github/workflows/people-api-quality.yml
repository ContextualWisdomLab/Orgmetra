name: People API Quality

on:
  pull_request:
    paths:
      - "services/people-api/**"
      - "packages/orgmetra-postgres/**"
      - "requirements/people-api-ci.txt"
      - ".github/workflows/people-api-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: people-api-quality-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  people-api-quality:
    name: Python ${{ matrix.python_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python_version:
          - "3.12"
          - "3.14"
    env:
      PYTHONPATH: services/people-api/src:packages/orgmetra-postgres/src
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
          cache-dependency-path: requirements/people-api-ci.txt
      - name: Install exact pinned dependencies
        run: >-
          python -m pip install
          --only-binary=:all:
          --no-deps
          -r requirements/people-api-ci.txt
      - name: Compile shipped packages
        run: |
          python -m compileall -q services/people-api/src
          python -m compileall -q packages/orgmetra-postgres/src
      - name: Run people API tests with exact coverage
        run: >-
          python -m coverage run
          --branch
          --source=orgmetra_people_api
          -m pytest
          services/people-api/tests
      - name: Enforce production statement and branch coverage
        run: |
          python -m coverage report --show-missing --fail-under=100
          python -m coverage json -o people-api-coverage.json
          python - <<'PY'
          import json

          with open("people-api-coverage.json", encoding="utf-8") as report_file:
              totals = json.load(report_file)["totals"]
          if totals["percent_covered"] != 100.0:
              raise SystemExit("production statement coverage is not 100%")
          if totals["num_branches"] and totals["covered_branches"] != totals["num_branches"]:
              raise SystemExit("production branch coverage is not 100%")
          PY
      - name: Enforce public docstring coverage
        run: python services/people-api/tests/validate_docstrings.py
      - name: Verify import and dependency consistency
        run: |
          python -c "import orgmetra_people_api; print(orgmetra_people_api.__all__)"
          python -m pip check
