name: PostgreSQL Package

on:
  pull_request:
    paths:
      - "packages/orgmetra-postgres/**"
      - "requirements/postgres-package-ci.txt"
      - ".github/workflows/postgres-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-package-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  package:
    name: Python ${{ matrix.python_version }} package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python_version:
          - "3.12"
          - "3.14"
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
          cache-dependency-path: requirements/postgres-package-ci.txt
      - name: Install exact package verification dependencies
        run: >-
          python -m pip install
          --only-binary=:all:
          --no-deps
          -r requirements/postgres-package-ci.txt
      - name: Build wheel and source distribution without network isolation
        run: python -m build --no-isolation packages/orgmetra-postgres
      - name: Inspect package contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("packages/orgmetra-postgres/dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")
          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              required = {
                  "orgmetra_postgres/__init__.py",
                  "orgmetra_postgres/context.py",
                  "orgmetra_postgres/errors.py",
                  "orgmetra_postgres/models.py",
                  "orgmetra_postgres/repository.py",
                  "orgmetra_postgres/py.typed",
              }
              missing = required - names
              if missing:
                  raise SystemExit(f"wheel is missing required files: {sorted(missing)}")
          sdists = list(Path("packages/orgmetra-postgres/dist").glob("*.tar.gz"))
          if len(sdists) != 1:
              raise SystemExit(f"expected one source distribution, found {len(sdists)}")
          PY
      - name: Install the wheel and smoke test outside the source tree
        run: |
          python -m pip install --no-deps --force-reinstall packages/orgmetra-postgres/dist/*.whl
          cd "$(mktemp -d)"
          env -u PYTHONPATH python - <<'PY'
          from orgmetra_postgres import PostgresPeopleRepository, PurposeContext

          assert PostgresPeopleRepository
          assert PurposeContext
          print("installed wheel smoke: ok")
          PY
      - name: Verify dependency consistency
        run: python -m pip check
