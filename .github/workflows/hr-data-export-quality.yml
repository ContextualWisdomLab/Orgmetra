name: HR Data Export Quality

on:
  pull_request:
    branches:
      - develop
      - feat/governed-hr-data-export-control
    paths:
      - "packages/hr-data-export/**"
      - ".github/requirements/foundation-test.txt"
      - ".github/workflows/hr-data-export-quality.yml"
      - "docs/doctoring/hr-data-export-control-references.md"
      - "docs/traceability/hr-data-export-control.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hr-data-export-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: HR data export contract and 100% coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact candidate checkout
        env:
          ORGMETRA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$ORGMETRA_EXPECTED_HEAD_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          check-latest: false
      - name: Install reviewed test toolchain
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r .github/requirements/foundation-test.txt
          python -m pip check
      - name: Compile export-control package
        run: python -m compileall -q packages/hr-data-export/src packages/hr-data-export/tests
      - name: Test HR data export review with exact statement and branch coverage
        env:
          PYTHONPATH: packages/hr-data-export/src
          COVERAGE_FILE: /tmp/orgmetra-hr-data-export.coverage
        run: python -m pytest -c packages/hr-data-export/pyproject.toml packages/hr-data-export/tests
      - name: Require clean checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
