name: Release Readiness Review Quality

on:
  pull_request:
    branches:
      - develop
    paths:
      - "packages/release-readiness-review/**"
      - ".github/requirements/foundation-test.txt"
      - ".github/workflows/release-readiness-review-quality.yml"
      - "docs/adr/0118-governed-release-readiness-review.md"
      - "docs/doctoring/release-readiness-review-references.md"
      - "docs/traceability/release-readiness-review.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-review-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Release-readiness governance and exact 100% coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact candidate checkout
        env:
          ORGMETRA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$ORGMETRA_EXPECTED_HEAD_SHA"
      - name: Set up exact Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          check-latest: false
      - name: Install reviewed test toolchain
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r .github/requirements/foundation-test.txt
          python -m pip check
      - name: Install reviewed package build backend
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r packages/release-readiness-review/build-requirements.txt
          python -m pip check
      - name: Compile owned Python
        run: python -m compileall -q packages/release-readiness-review/src packages/release-readiness-review/tests
      - name: Require beginner-readable docstrings
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          discovered = 0
          for path in sorted(Path("packages/release-readiness-review").rglob("*.py")):
              discovered += 1
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, (ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)) and ast.get_docstring(node) is None:
                      raise SystemExit(f"missing docstring: {path}:{node.lineno} {node.name}")
          if discovered == 0:
              raise SystemExit("release-readiness docstring gate discovered no Python files")
          PY
      - name: Test exact statement and branch coverage
        env:
          PYTHONPATH: packages/release-readiness-review/src
          COVERAGE_FILE: /tmp/orgmetra-release-readiness-review.coverage
        run: python -m pytest -c packages/release-readiness-review/pyproject.toml packages/release-readiness-review/tests
      - name: Prove hash-bound isolated package install
        run: |
          rm -rf /tmp/orgmetra-release-readiness-review-build /tmp/orgmetra-release-readiness-review-wheels /tmp/orgmetra-release-readiness-review-installed
          cp -R packages/release-readiness-review /tmp/orgmetra-release-readiness-review-build
          mkdir -p /tmp/orgmetra-release-readiness-review-wheels
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir /tmp/orgmetra-release-readiness-review-wheels /tmp/orgmetra-release-readiness-review-build
          mapfile -t wheels < <(find /tmp/orgmetra-release-readiness-review-wheels -maxdepth 1 -type f -name '*.whl' -print)
          test "${#wheels[@]}" -eq 1
          wheel="${wheels[0]}"
          wheel_sha="$(sha256sum "$wheel" | cut -d' ' -f1)"
          printf 'file://%s --hash=sha256:%s\n' "$wheel" "$wheel_sha" > /tmp/orgmetra-release-readiness-review-wheel.txt
          python -m pip install --require-hashes --no-deps --target /tmp/orgmetra-release-readiness-review-installed -r /tmp/orgmetra-release-readiness-review-wheel.txt
          PYTHONPATH=/tmp/orgmetra-release-readiness-review-installed python - <<'PY'
          import orgmetra_release_readiness_review as package
          assert "ReleaseReadinessReviewPacket" in package.__all__
          assert "build_release_readiness_review_packet" in package.__all__
          PY
      - name: Require clean checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
