name: Requisition Review Quality

on:
  pull_request:
    branches:
      - develop
    paths:
      - "packages/requisition-review/**"
      - ".github/requirements/foundation-test.txt"
      - ".github/workflows/requisition-review-quality.yml"
      - ".github/workflows/candidate-application-quality.yml"
      - "database/migrations/0014_candidate_application_core.sql"
      - "tests/test_candidate_application_postgres.sh"
      - "docs/adr/0013-governed-requisition-review-packet.md"
      - "docs/adr/0026-normalized-candidate-application.md"
      - "docs/doctoring/requisition-review-references.md"
      - "docs/doctoring/candidate-application-references.md"
      - "docs/traceability/requisition-review.md"
      - "docs/traceability/candidate-application-core.md"
      - "docs/TRACEABILITY.md"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: requisition-review-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Requisition review contract and 100% coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact candidate checkout
        env:
          ORGMETRA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$ORGMETRA_EXPECTED_HEAD_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          check-latest: false
      - name: Install reviewed test toolchain
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r .github/requirements/foundation-test.txt
          python -m pip check
      - name: Compile requisition review package
        run: python -m compileall -q packages/requisition-review/src packages/requisition-review/tests
      - name: Test requisition review contract with exact statement and branch coverage
        env:
          PYTHONPATH: packages/requisition-review/src
          COVERAGE_FILE: /tmp/orgmetra-requisition-review.coverage
        run: python -m pytest -c packages/requisition-review/pyproject.toml packages/requisition-review/tests
      - name: Require clean checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  candidate_application_postgres:
    name: Candidate application PostgreSQL contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.14@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: orgmetra
          POSTGRES_PASSWORD: orgmetra
          POSTGRES_DB: orgmetra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orgmetra -d orgmetra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://orgmetra:orgmetra@localhost:5432/orgmetra
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove exact candidate checkout
        env:
          ORGMETRA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$ORGMETRA_EXPECTED_HEAD_SHA"
      - name: Prove candidate application test syntax
        run: bash -n tests/test_candidate_application_postgres.sh
      - name: Prove normalized candidate application persistence
        run: bash tests/test_candidate_application_postgres.sh
      - name: Require clean checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
