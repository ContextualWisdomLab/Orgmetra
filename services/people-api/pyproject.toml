[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "orgmetra-people-api"
version = "0.1.0"
description = "Purpose-bound customer API boundary for authoritative Orgmetra HR records."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ContextualWisdomLab" }]
dependencies = [
  "orgmetra-hris-kernel==0.4.0",
  "orgmetra-keyverse-adapter==0.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orgmetra_people_api = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=orgmetra_people_api",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["orgmetra_people_api"]

[tool.coverage.report]
fail_under = 100
show_missing = true
