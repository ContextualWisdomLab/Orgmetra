[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "orgmetra-job-analysis-api"
version = "0.1.0"
description = "Governed persistence boundary for Orgmetra job-analysis snapshots."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "ContextualWisdomLab" }]
dependencies = [
  "orgmetra-hris-kernel==0.4.0",
  "orgmetra-keyverse-adapter==0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-cov>=5.0"]

[tool.uv.sources]
orgmetra-hris-kernel = { path = "../../packages/hris-kernel" }
orgmetra-keyverse-adapter = { path = "../../packages/keyverse-adapter" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orgmetra_job_analysis_api = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=orgmetra_job_analysis_api",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["orgmetra_job_analysis_api"]

[tool.coverage.report]
fail_under = 100
show_missing = true
