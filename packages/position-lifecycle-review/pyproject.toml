[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "orgmetra-position-lifecycle-review"
version = "0.1.0"
description = "Governed Position lifecycle-change review evidence for Orgmetra."
requires-python = ">=3.14"

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=orgmetra_position_lifecycle_review",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]
