[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orgmetra-hr-document-retrieval"
version = "0.1.0"
description = "Purpose-bound, audited HR document retrieval execution boundary for Orgmetra."
requires-python = ">=3.14,<3.15"

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=orgmetra_hr_document_retrieval",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]
