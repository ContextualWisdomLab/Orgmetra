[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orgmetra-audit-evidence-review"
version = "0.1.0"
description = "Purpose-bound immutable audit-evidence review contracts for Orgmetra."
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=orgmetra_audit_evidence_review",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]
