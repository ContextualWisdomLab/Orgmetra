[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orgmetra-domain"
version = "0.1.0"
description = "Bitemporal people, employment, position, and assignment domain invariants for Orgmetra."
requires-python = ">=3.11"
license = "Apache-2.0"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orgmetra_domain = ["py.typed"]
