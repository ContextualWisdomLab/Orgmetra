[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orgmetra-migration-adapter"
version = "0.1.0"
description = "Fail-closed governed migration handoff evidence for Orgmetra."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ContextualWisdomLab" }]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=orgmetra_migration_adapter",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["orgmetra_migration_adapter"]

[tool.coverage.report]
fail_under = 100
show_missing = true
