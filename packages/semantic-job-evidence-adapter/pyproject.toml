[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orgmetra-semantic-job-evidence-adapter"
version = "0.1.0"
description = "Fail-closed Semantic Data Portal ontology evidence boundary for Orgmetra job analysis."
requires-python = ">=3.12,<3.15"

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=orgmetra_semantic_job_evidence_adapter",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]
