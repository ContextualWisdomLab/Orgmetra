[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "orgmetra-performance-goal-plan"
version = "0.1.0"
description = "Governed performance-goal plan activation evidence for Orgmetra."
requires-python = ">=3.14"

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=orgmetra_performance_goal_plan",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]
