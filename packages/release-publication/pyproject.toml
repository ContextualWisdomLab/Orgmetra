[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orgmetra-release-publication"
version = "0.1.0"
description = "Audited exact-revision release publication boundary for Orgmetra"
requires-python = ">=3.14,<3.15"
dependencies = ["orgmetra-release-authorization==0.1.0"]

[tool.pytest.ini_options]
addopts = "--cov=orgmetra_release_publication --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
