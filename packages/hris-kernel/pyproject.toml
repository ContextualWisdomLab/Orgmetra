[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orgmetra-hris-kernel"
version = "0.4.0"
description = "Identity-scoped bitemporal employment-truth kernel for Orgmetra."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ContextualWisdomLab" }]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=orgmetra_hris_kernel",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["orgmetra_hris_kernel"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
  "if TYPE_CHECKING:",
]
